services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: pricewise
      POSTGRES_USER: pricewise
      POSTGRES_PASSWORD: pricewise
    ports:
      - "5432:5432"
  dashboard:
    image: python:3.12-slim
    working_dir: /app
    command: bash -lc "pip install -r requirements.txt && streamlit run app/dashboard/__init__.py"
    volumes:
      - .:/app
    ports:
      - "8501:8501"
    depends_on:
      - db
